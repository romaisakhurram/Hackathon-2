# Kubernetes namespace manifests for Todo Chatbot System
# Defines the namespaces for different components of the application

---
apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
  labels:
    name: todo-app
---
apiVersion: v1
kind: Namespace
metadata:
  name: dapr-system
  labels:
    name: dapr-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    name: kafka
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring