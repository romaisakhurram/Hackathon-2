apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: todo-app
  labels:
    app: chatbot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "chatbot-service"
        dapr.io/app-port: "8000"
        dapr.io/app-protocol: "http"
        dapr.io/config: "daprConfig"
        dapr.io/log-level: "info"
    spec:
      containers:
      - name: chatbot-service
        image: chatbot-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: api-key
        - name: DATABASE_URL
          value: "postgresql://user:password@postgres:5432/todo_db"
        - name: REDIS_HOST
          value: "redis-master"
        - name: REDIS_PORT
          value: "6379"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: todo-app
  labels:
    app: chatbot-service
spec:
  selector:
    app: chatbot-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP